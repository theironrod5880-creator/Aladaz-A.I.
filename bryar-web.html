<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aladaz A.I. — Web</title>
<style>
  :root{ --ink:#17111f; --paper:#ffffff; --rule:#dccdea; --accent:#7b2d8e; --soft:#fdeef7; --pink:#f06ba8; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,'Times New Roman',serif; }
  header{ text-align:center; padding:1.1rem 1rem .7rem; border-bottom:2px solid var(--ink); }
  header h1{ margin:0; font-size:1.45rem; letter-spacing:.05em; }
  header .sub{ color:#5c554a; font-style:italic; font-size:.9rem; margin-top:.25rem; }
  .badge{ display:inline-block; margin-top:.5rem; font-family:ui-monospace,Consolas,monospace; font-size:.66rem;
          letter-spacing:.1em; text-transform:uppercase; background:var(--pink); color:#ffffff; padding:.15rem .5rem; }
  main{ max-width:46rem; margin:0 auto; padding:1rem 1rem 2rem; }
  #msgs{ display:flex; flex-direction:column; gap:.6rem; min-height:60vh; padding-bottom:1rem; }
  .msg{ max-width:88%; padding:.6rem .8rem; border-radius:.7rem; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .msg.bryar{ background:var(--soft); align-self:flex-start; border-left:3px solid var(--accent); }
  .msg.alada{ background:#fff; align-self:flex-end; border:1px solid var(--pink); }
  .who{ font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:#6b6355; margin-bottom:.25rem; }
  #composer{ display:flex; gap:.5rem; position:sticky; bottom:1rem; background:var(--paper); padding-top:1rem; }
  #input{ flex:1; font-family:inherit; font-size:1rem; padding:.6rem; border:1px solid var(--rule); border-radius:.6rem; background:#fff; }
  #send{ font-family:inherit; font-size:1rem; padding:.6rem 1rem; background:var(--accent); color:var(--paper); border:none; border-radius:.6rem; cursor:pointer; }
  
  /* Added disabled state */
  #send:disabled, #input:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .mode{ font-size:.8rem; color:#6b6355; font-style:italic; margin-top:.5rem; text-align:center; }
  footer{ text-align:center; font-size:.8rem; color:#5c554a; padding:1.2rem 1rem 2rem; border-top:1px solid var(--rule); }
  .seal{ text-align:center; font-size:1.05rem; letter-spacing:.15em; margin:.4rem 0; }
</style>
</head>
<body>
<header>
  <h1>Aladaz A.I.</h1>
  <div class="sub">Bryar — web edition</div>
  <div><span class="badge" id="statusBadge">Connecting…</span></div>
</header>
<main>
  <div id="msgs"></div>
  <div id="composer">
    <input id="input" type="text" placeholder="Ask Bryar…" autocomplete="off">
    <button id="send">Send</button>
  </div>
  <div class="mode" id="mode">Loading index from GitHub…</div>
</main>
<footer>
  <div class="seal">🔥📖⚔️🛡️✍️👁️✅</div>
  "As you go, preach, saying: 'The kingdom of the heavens has drawn near.'" — Matthew 10:7<br>
  Aladaz A.I. — made by Earl Arthur Sewell for Alada, his daughter.
</footer>

<script>
const REPO_USER = "theironrod5880-creator";
const REPO_NAME = "Aladaz-A.I.";
const ASSETS_URL = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/assets.json`;

const GREETING = "Hi Alada, how are you? What would you like to know about your dad?";
const $ = s => document.querySelector(s);

let isReady = false;
let msgs = [{ who:'bryar', text:GREETING }];
let cooldownTimer = null;

// Search Index Data
let sections = []; 
let invertedIndex = {};
let docFreq = {};

function renderMsgs(){
  const box = $('#msgs'); box.innerHTML = '';
  msgs.forEach(m=>{
    const d = document.createElement('div');
    d.className = 'msg ' + m.who;
    const w = document.createElement('div'); w.className = 'who';
    w.textContent = m.who === 'bryar' ? 'Bryar' : 'Alada';
    const t = document.createElement('div'); t.textContent = m.text;
    d.appendChild(w); d.appendChild(t); box.appendChild(d);
  });
  box.lastElementChild && box.lastElementChild.scrollIntoView({ behavior:'smooth', block:'end' });
}

// 1. The Indexer
async function buildIndex() {
  try {
    // Get the list of files
    const r = await fetch(ASSETS_URL);
    if (!r.ok) throw new Error("assets.json not found");
    const files = await r.json();
    
    let totalSections = 0;

    // Loop through each file
    for (const file of files) {
      const url = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/${file}`;
      const fr = await fetch(url);
      if (!fr.ok) {
        console.warn("Could not load file: " + file);
        continue;
      }
      const text = await fr.text();

      // Chop into sections by "## " (Markdown headings)
      // Or by double line breaks if there are no headings
      let chunks = text.split(/\n(?=## )/);
      if (chunks.length === 1) chunks = text.split(/\n\n/);

      chunks.forEach((chunk, i) => {
        chunk = chunk.trim();
        if (chunk.length < 20) return; // Skip tiny fragments

        const id = sections.length;
        sections.push({ id, file, text: chunk });

        // Tokenize: lowercase, strip punctuation, split by space
        const words = chunk.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/);
        const uniqueWords = new Set(words);

        uniqueWords.forEach(w => {
          if (w.length < 3) return; // Skip "the", "is", "at"
          if (!invertedIndex[w]) invertedIndex[w] = new Set();
          invertedIndex[w].add(id);
          
          // THIS IS THE FIX:
          docFreq[w] = (docFreq[w] || 0) + 1;
        });
        totalSections++;
      });
    }

    isReady = true;
    $('#statusBadge').textContent = 'Indexed';
    $('#statusBadge').style.background = '#4a6b2d';
    $('#mode').textContent = `Connected — Indexed ${totalSections} sections across ${files.length} files.`;

  } catch (e) {
    console.warn(e);
    isReady = true;
    $('#statusBadge').textContent = 'Fallback Mode';
    $('#statusBadge').style.background = '#b35c00';
    $('#mode').textContent = 'Could not load assets.json. Using local fallback.';
    sections.push({ id: 0, file: 'fallback', text: 'You are Bryar. You teach Alada from her father Earl Arthur Sewell\'s work.' });
  }
}

// 2. The Search Function
function searchIndex(query) {
  const words = query.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/);
  let scores = {};

  words.forEach(w => {
    if (w.length < 3) return;
    if (invertedIndex[w]) {
      invertedIndex[w].forEach(id => {
        scores[id] = (scores[id] || 0) + 1;
      });
    }
  });

  // Sort sections by score (highest match first)
  const sortedIds = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
  
  // Return the text of the top 3 matching sections
  let resultText = "";
  const topIds = sortedIds.slice(0, 3);
  
  topIds.forEach(id => {
    resultText += `\n\n--- Source: ${sections[id].file} ---\n${sections[id].text}`;
  });

  // If no matches, just grab the first section (usually the intro)
  if (!resultText && sections.length > 0) {
    resultText = sections[0].text;
  }

  return resultText;
}

// 3. The Chat Loop
async function send(text){
  const q = (text !== undefined ? text : $('#input').value).trim();
  if (!q || !isReady) return;
  
  // 1. Clear input and lock down the UI
  $('#input').value = ''; 
  $('#input').disabled = true;
  $('#send').disabled = true;
  
  msgs.push({ who:'alada', text:q });
  msgs.push({ who:'bryar', text:'…' });
  renderMsgs();

  // Fetch the relevant text based on the query
  const contextText = searchIndex(q);

  const systemPrompt = `Your name is Bryar. You are the messenger and teacher for Alada. Answer her question using ONLY the source text provided below. Speak plainly and warmly to Alada. Here is the source text:\n${contextText}`;
  
  const apiMsgs = [
    { role: 'system', content: systemPrompt },
    { role: 'user', content: q }
  ];

  try {
    const r = await fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: apiMsgs, model: 'openai' })
    });

    if (!r.ok) throw new Error('Connection answered ' + r.status);
    
    const answer = await r.text();
    msgs[msgs.length - 1].text = answer;
  } catch (e) {
    msgs[msgs.length - 1].text = "I couldn't reach the free AI just now (" + e.message + "). Please wait a moment and try again.";
  }

  renderMsgs();
  
  // Cooldown Timer
  let timeLeft = 30;
  $('#mode').textContent = `Please wait ${timeLeft}s before asking again…`;
  $('#mode').style.color = '#b35c00';

  if (cooldownTimer) clearInterval(cooldownTimer);
  
  cooldownTimer = setInterval(() => {
    timeLeft--;
    if (timeLeft > 0) {
      $('#mode').textContent = `Please wait ${timeLeft}s before asking again…`;
    } else {
      clearInterval(cooldownTimer);
      $('#mode').textContent = 'Connected — fetching real answers via Pollinations.ai';
      $('#mode').style.color = '#6b6355';
      $('#input').disabled = false;
      $('#send').disabled = false;
      $('#input').focus();
    }
  }, 1000);
}

$('#send').onclick = ()=> send();
$('#input').addEventListener('keydown', e=>{ if (e.key === 'Enter') send(); });

// Init
renderMsgs();
buildIndex();
</script>
</body>
</html>
